openapi: 3.1.0
info:
  title: auth — emissão de token (login)
  version: "1.0"
  description: >
    Autentica credenciais e emite o token de acesso (com claims de identidade: usuário, papéis,
    organizações, tenants). Dois domínios: /up (plataforma) e /ua (externo). Não valida token (cada
    serviço consumidor valida). Detalhe: README.md, endpoints/*.md.
servers:
  - url: /
    description: Acesso via gateway da plataforma (host omitido por política).
tags:
  - { name: login }
paths:
  /up/sign-in:
    post:
      tags: [login]
      summary: Login (plataforma) — emite token
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { description: Autenticado, content: { application/json: { schema: { $ref: '#/components/schemas/JwtResponse' } } } }
        '401': { description: Credenciais inválidas }
        '403': { description: Conta pendente (em validação) }
        '417': { description: Falha de serviço dependente }
  /ua/sign-in:
    post:
      tags: [login]
      summary: Login (externo) — emite token (inclui tenants)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { description: Autenticado, content: { application/json: { schema: { $ref: '#/components/schemas/JwtResponse' } } } }
        '401': { description: Credenciais inválidas }
        '417': { description: Falha de serviço dependente }
  /up/sign-in/renew:
    get:
      tags: [login]
      summary: Renovar token (a partir do token atual)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Token renovado, content: { application/json: { schema: { $ref: '#/components/schemas/JwtResponse' } } } }
        '401': { description: Token ausente/inválido/expirado }
        '417': { description: Falha de serviço dependente }
  /ua/.well-known/jwks.json:
    get:
      tags: [login]
      summary: Chave pública do accessTokenEs256 (JWKS) — público; keys vazio enquanto o ES256 não estiver ligado
      responses:
        '200': { description: JWK Set, content: { application/json: { schema: { $ref: '#/components/schemas/Jwks' } } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    JwtResponse:
      type: object
      properties:
        accessToken: { type: string, description: "Token de acesso (usar em Authorization: Bearer)" }
        accessTokenEs256: { type: string, description: "O mesmo token assinado em ES256, com kid; para quem valida pela chave pública do JWKS. Ausente com o ES256 desligado" }
        tokenType: { type: string, example: Bearer }
        id: { type: integer }
        username: { type: string }
        name: { type: string }
        email: { type: string }
        roles: { type: array, items: { type: string } }
        mcpSessionId: { type: string, format: uuid }
    Jwks:
      type: object
      properties:
        keys:
          type: array
          items:
            type: object
            properties:
              kty: { type: string, example: EC }
              crv: { type: string, example: P-256 }
              use: { type: string, example: sig }
              alg: { type: string, example: ES256 }
              kid: { type: string }
              x: { type: string, description: "coordenada x, base64url, 32 bytes" }
              y: { type: string, description: "coordenada y, base64url, 32 bytes" }

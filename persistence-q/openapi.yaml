openapi: 3.1.0
info:
  title: persistence-q — consultas (lado de leitura)
  version: "1.0"
  description: >
    Consulta projeções materializadas por critério (DSL modo array/object). Idempotente; não modifica
    estado. Detalhe: README.md, endpoints/consulta.md. Apenas o endpoint autenticado consta.
servers:
  - url: /
    description: Acesso via gateway da plataforma (host omitido por política).
security:
  - bearerAuth: []
paths:
  /:
    post:
      summary: Consultar projeções por critério
      parameters: [{ $ref: '#/components/parameters/tenant' }]
      requestBody:
        required: true
        description: "Modo detectado pelo 1º caractere: '[' array (multi-critério) ou '{' object (critério único). Cada critério: { rótulo: { predicados } } MAIS controles opcionais (_paging/_sorting/_count/_connective/_cache) no MESMO nível (irmãos do rótulo)."
        content:
          application/json:
            schema:
              oneOf:
                - { type: array, items: { $ref: '#/components/schemas/Criterio' } }
                - { $ref: '#/components/schemas/Criterio' }
      responses:
        '200':
          description: "Array no topo, mesma ordem dos critérios; itens vazios como []."
          content: { application/json: { schema: { type: array, items: { type: object } } } }
        '204': { description: Todos os critérios vazios }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Não autenticado }
        '403': { description: Tenant não autorizado }
        '510': { description: Falha de execução da consulta (ex. predicado desconhecido) }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    tenant: { name: X-Tenant-Id, in: header, required: true, schema: { type: string, format: uuid }, description: "Cabeçalho de tenant (isolamento)." }
  responses:
    BadRequest: { description: JSON inválido, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Error: { type: object, properties: { error: { type: string } } }
    Criterio:
      type: object
      minProperties: 1
      description: "Um rótulo (= nome da projeção) → objeto de predicados; MAIS controles opcionais no MESMO nível (irmãos do rótulo). Predicados combinam por _connective (AND padrão | OR)."
      properties:
        _connective: { type: string, enum: [AND, OR], description: "Combina os predicados; padrão AND; global ao critério." }
        _paging: { type: object, properties: { _maxRegisters: { type: integer }, _firstRegister: { type: integer } } }
        _sorting: { type: object, description: "Indexado por posição \"0\",\"1\",\"2\"; cada um { _orderBy, _order }.", additionalProperties: { type: object, properties: { _orderBy: { type: string }, _order: { type: string, enum: [ASC, DESC] } } } }
        _count: { type: boolean, description: "true devolve totalRegisters." }
        _cache: { type: object, properties: { _behavior: { type: string, enum: [use, evict, ignore] }, _ttl: {} } }
      additionalProperties: { type: object, additionalProperties: true }

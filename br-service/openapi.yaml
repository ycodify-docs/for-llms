openapi: 3.1.0
info:
  title: br-service — regras de negócio e coordenação
  version: "1.0"
  description: >
    Executa o processador (função) identificado por uma rota. Chamado pelo persistence-crs (não pelo
    cliente). Resposta = objeto direto do processador (sem envelope). Detalhe: README.md, endpoints/br.md.
servers:
  - url: /
    description: Acesso interno entre serviços (host omitido por política).
paths:
  /br:
    post:
      summary: Executar o processador da rota
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [route]
              properties:
                route:
                  type: string
                  description: "Rota canônica totalmente qualificada: <org>/<project>/<bc>/<aggregate>/<comando> | .../coordination/<nome> | .../projection/<nome>."
                data:
                  type: object
                  description: "Dados passados ao processador (se ausente, o corpo inteiro é usado)."
      responses:
        '200':
          description: "Objeto retornado diretamente pelo processador (sem envelope)."
          content: { application/json: { schema: { type: object } } }
        '400':
          description: "Validação, rota inexistente, ou exceção do processador."
          content: { application/json: { schema: { $ref: '#/components/schemas/BrError' } } }
  /v3/brservice/logs/query/{term}/from/{f}/to/{t}:
    get:
      summary: Consultar o log de execução
      description: >
        Registros das execuções de regra/coordenação, filtrados por termo (substring, sem diferenciar
        maiúsculas; `*` = todos) e por intervalo inclusivo. Autorizado pela chave própria `X-Logs-Key`,
        não pelo token de usuário. Só metadados — o payload do comando não é registrado.
        NOTA DE CAMINHO: diferente de `/br`, que é o caminho interno (o serviço é chamado
        serviço-a-serviço, sem passar pelo gateway), este path já inclui o prefixo público
        `/v3/brservice` — é a URL que o cliente usa.
      parameters:
        - name: term
          in: path
          required: true
          schema: { type: string }
          description: "Texto procurado no registro. `*` devolve tudo do intervalo."
        - name: f
          in: path
          required: true
          schema: { type: string }
          description: "Início do intervalo (inclusivo): ISO 8601 ou epoch em milissegundos."
        - name: t
          in: path
          required: true
          schema: { type: string }
          description: "Fim do intervalo (inclusivo): ISO 8601 ou epoch em milissegundos."
        - name: X-Logs-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
          description: "Chave de consulta, entregue no provisionamento."
      responses:
        '200':
          description: "Resultado da busca."
          content: { application/json: { schema: { $ref: '#/components/schemas/BrLogQueryResult' } } }
        '400':
          description: "Intervalo fora de formato, ou início posterior ao fim."
          content: { application/json: { schema: { $ref: '#/components/schemas/BrError' } } }
        '401':
          description: "X-Logs-Key ausente ou incorreta."
          content: { application/json: { schema: { $ref: '#/components/schemas/BrError' } } }
        '503':
          description: "Consulta de log não provisionada neste ambiente."
          content: { application/json: { schema: { $ref: '#/components/schemas/BrError' } } }
  /v3/brservice/logs/query/{term}/file/{file}/from/{f}/to/{t}:
    get:
      summary: Consultar o log de execução, filtrando também pelo arquivo do erro
      description: >
        Mesma consulta da forma sem `file`, com um filtro a mais: o arquivo onde o erro foi lançado.
        Os dois filtros SOMAM — o registro precisa conter o termo E ter falhado no arquivo indicado.
        Para filtrar só por arquivo, passe `*` no `term`. Como o filtro casa por substring, use o nome
        do arquivo, sem a extensão, ou um trecho do caminho, sem barra: barra codificada
        em segmento de caminho costuma ser recusada pelos proxies do caminho público.
        Filtrar por arquivo implica erro — execução bem-sucedida tem `erroArquivo` vazio.
      parameters:
        - name: term
          in: path
          required: true
          schema: { type: string }
          description: "Texto procurado no registro. `*` desliga este filtro."
        - name: file
          in: path
          required: true
          schema: { type: string }
          description: "Trecho de `erroArquivo`. `*` aceita qualquer arquivo."
        - name: f
          in: path
          required: true
          schema: { type: string }
          description: "Início do intervalo (inclusivo): ISO 8601 ou epoch em milissegundos."
        - name: t
          in: path
          required: true
          schema: { type: string }
          description: "Fim do intervalo (inclusivo): ISO 8601 ou epoch em milissegundos."
        - name: X-Logs-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
          description: "Chave de consulta, entregue no provisionamento."
      responses:
        '200':
          description: "Resultado da busca."
          content: { application/json: { schema: { $ref: '#/components/schemas/BrLogQueryResult' } } }
        '400':
          description: "Intervalo fora de formato, ou início posterior ao fim."
          content: { application/json: { schema: { $ref: '#/components/schemas/BrError' } } }
        '401':
          description: "X-Logs-Key ausente ou incorreta."
          content: { application/json: { schema: { $ref: '#/components/schemas/BrError' } } }
        '503':
          description: "Consulta de log não provisionada neste ambiente."
          content: { application/json: { schema: { $ref: '#/components/schemas/BrError' } } }
  /v3/brservice/processors/deploy/{org}:
    post:
      summary: Implantar os processadores de uma organização
      description: >
        Publica os processadores da organização a partir de um arquivo compactado enviado como corpo
        CRU (não é formulário nem multipart). Substitui a árvore INTEIRA daquela organização: o que não
        vier no pacote deixa de existir. As outras organizações não são tocadas. As rotas entram em vigor
        sem reinício. Exige as DUAS credenciais: X-Processors-Deploy-Credential autoriza a operação, e o
        Authorization: Bearer diz em que organizações o portador pode publicar — a org da URL precisa
        estar entre elas. O pacote é validado por inteiro antes de qualquer gravação; falhou uma entrada,
        nada é publicado.
      parameters:
        - name: org
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$' }
          description: >
            Organização: primeiro segmento da rota e pasta raiz dos processadores dela. Minúsculas,
            dígitos, "-" e "_"; começa por letra ou dígito; até 64 caracteres.
        - name: X-Processors-Deploy-Credential
          in: header
          required: true
          schema: { type: string, format: uuid }
          description: "Credencial da operação, entregue no provisionamento."
        - name: Authorization
          in: header
          required: true
          schema: { type: string }
          description: "Bearer <token de acesso>. Assinatura verificada; define as organizações permitidas."
      requestBody:
        required: true
        description: >
          O arquivo compactado cru, no máximo 5 MB. Acima disso a requisição é barrada na borda da
          plataforma e devolve 413, sem o corpo de erro deste serviço.
        content:
          application/zip:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: "Publicado."
          content: { application/json: { schema: { $ref: '#/components/schemas/BrDeployResult' } } }
        '400':
          description: "Pacote inválido: caminho suspeito, extensão recusada, erro de sintaxe, teto estourado, corpo vazio, organização com nome inválido."
          content: { application/json: { schema: { $ref: '#/components/schemas/BrError' } } }
        '401':
          description: "Credencial ausente/incorreta, ou token ausente, expirado, com assinatura inválida ou algoritmo trocado."
          content: { application/json: { schema: { $ref: '#/components/schemas/BrError' } } }
        '403':
          description: "O portador do token não está vinculado à organização da URL."
          content: { application/json: { schema: { $ref: '#/components/schemas/BrError' } } }
        '500':
          description: "Falha ao trocar a árvore no destino; o estado anterior é restaurado."
          content: { application/json: { schema: { $ref: '#/components/schemas/BrError' } } }
        '503':
          description: "Implantação não provisionada neste ambiente."
          content: { application/json: { schema: { $ref: '#/components/schemas/BrError' } } }
  /v3/brservice/processors/rollback/{org}/{backupId}:
    post:
      summary: Desfazer a última implantação de uma organização
      description: >
        Repõe a árvore que estava no lugar antes da publicação identificada por backupId, e recarrega as
        rotas. Mesmas credenciais e mesma checagem de organização do deploy. O backupId pertence a uma
        organização — usar o de outra é recusado.
      parameters:
        - name: org
          in: path
          required: true
          schema: { type: string }
        - name: backupId
          in: path
          required: true
          schema: { type: string }
          description: >
            Devolvido no campo backupId da resposta da publicação. Começa pelo nome da organização —
            usá-lo na URL de outra é recusado. Não é inventável.
        - name: X-Processors-Deploy-Credential
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: Authorization
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: "Restaurado."
          content: { application/json: { schema: { $ref: '#/components/schemas/BrRollbackResult' } } }
        '400':
          description: "backupId de outra organização, ou organização com nome inválido."
          content: { application/json: { schema: { $ref: '#/components/schemas/BrError' } } }
        '401':
          description: "Credencial ou token inválidos."
          content: { application/json: { schema: { $ref: '#/components/schemas/BrError' } } }
        '403':
          description: "O portador do token não está vinculado à organização da URL."
          content: { application/json: { schema: { $ref: '#/components/schemas/BrError' } } }
        '404':
          description: "backupId não encontrado."
          content: { application/json: { schema: { $ref: '#/components/schemas/BrError' } } }
        '503':
          description: "Implantação não provisionada neste ambiente."
          content: { application/json: { schema: { $ref: '#/components/schemas/BrError' } } }
components:
  schemas:
    BrError:
      type: object
      properties:
        status: { type: string, example: error }
        mensagem: { type: string }
        tipo: { type: string }
    BrDeployResult:
      type: object
      properties:
        org: { type: string }
        backupId:
          type: string
          nullable: true
          description: "Identificador para desfazer. Null quando não havia árvore anterior."
        substituiuArvoreAnterior: { type: boolean }
        arquivos:
          type: array
          items: { type: string }
          description: "Caminhos publicados, relativos à raiz da organização."
        rotas:
          type: array
          items: { type: string }
          description: "Rotas que o pacote pretendia publicar."
        recarga: { $ref: '#/components/schemas/BrRecarga' }
    BrRollbackResult:
      type: object
      properties:
        org: { type: string }
        backupId: { type: string }
        restaurado: { type: boolean }
        recarga: { $ref: '#/components/schemas/BrRecarga' }
    BrRecarga:
      type: object
      description: >
        O que o serviço passou a atender DE FATO. Compare `adicionadas` com `rotas`: arquivo que não
        exporte uma função de processador aparece em `arquivos` e não aqui.
      properties:
        total: { type: integer, description: "Total de rotas ativas após a recarga." }
        adicionadas:
          type: array
          items: { type: string }
        removidas:
          type: array
          items: { type: string }
          description: "Rotas que deixaram de existir por não constarem do pacote."
    BrLogQueryResult:
      type: object
      properties:
        total: { type: integer, description: "Quantos registros vieram nesta resposta." }
        truncado: { type: boolean, description: "true = teto atingido; há mais registros no intervalo." }
        limite: { type: integer, description: "Teto de registros por consulta." }
        registros:
          type: array
          items: { $ref: '#/components/schemas/BrLogEntry' }
    BrLogEntry:
      type: object
      properties:
        ts: { type: string, format: date-time }
        traceId: { type: string, nullable: true, description: "Identificador de correlação, quando propagado pelo chamador." }
        spanId: { type: string, nullable: true }
        tenantId:
          type: string
          description: >
            Tenant da execução. Sempre presente; string vazia quando a requisição não trouxe tenant
            em nenhuma das origens possíveis (cabeçalho, corpo da execução síncrona, ou payload do
            evento nos hooks de coordenação/projeção).
        route: { type: string, nullable: true }
        outcome: { type: string, enum: [success, validation_error, processor_error] }
        durationMs: { type: integer }
        bytesIn: { type: integer }
        bytesOut: { type: integer }
        dataKeys:
          type: array
          items: { type: string }
          description: "NOMES dos campos recebidos em data — nunca os valores."
        erroTipo: { type: string, nullable: true }
        erroMensagem: { type: string, nullable: true, description: "Truncada; o corte é sinalizado no fim do texto." }
        erroArquivo:
          type: string
          description: >
            Onde o erro foi lançado, no formato `caminho:linha` — o arquivo da função que falhou.
            String vazia quando não houve erro.

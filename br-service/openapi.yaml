openapi: 3.1.0
info:
  title: br-service — regras de negócio e coordenação
  version: "1.0"
  description: >
    Executa o processador (função) identificado por uma rota. Chamado pelo persistence-crs (não pelo
    cliente). O serviço não acrescenta envelope à resposta — mas o que o processador deve RETORNAR
    depende do contexto de invocação: objeto direto no contexto síncrono, envelope processedData nos
    dois contextos assíncronos. Os campos authToken e tenantIds decidem quantos argumentos o processador
    recebe. Detalhe: README.md, contextos.md, endpoints/br.md.
servers:
  - url: /
    description: Acesso interno entre serviços (host omitido por política).
paths:
  /br:
    post:
      summary: Executar o processador da rota
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [route]
              properties:
                route:
                  type: string
                  description: "Rota canônica totalmente qualificada: <org>/<project>/<bc>/<aggregate>/<comando> | .../coordination/<nome> | .../projection/<nome>."
                data:
                  type: object
                  description: "Dados passados ao processador (se ausente, o corpo inteiro é usado)."
                authToken:
                  type: [string, "null"]
                  description: >-
                    Token de acesso do usuario. Enviado apenas no contexto SINCRONO (regra de negocio do
                    comando), e mesmo la pode ser nulo. Ausente nos contextos assincronos.
                tenantIds:
                  type: array
                  items: { type: string }
                  description: >-
                    Lista com UM tenant, vindo do modelo de leitura do agregado. Enviada apenas no
                    contexto SINCRONO. Nao e o tenant do cabecalho da requisicao.
      responses:
        '200':
          description: >-
            Objeto retornado pelo processador, sem envelope acrescentado pelo servico. A forma esperada
            varia por contexto de invocacao (ver contextos.md).
          content: { application/json: { schema: { type: object } } }
        '400':
          description: >-
            Falha. O corpo tem DOIS formatos: falha de validacao do corpo devolve BrValidationError
            (um campo so, "erro"); rota inexistente e excecao do processador devolvem BrError.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BrError'
                  - $ref: '#/components/schemas/BrValidationError'
components:
  schemas:
    BrError:
      type: object
      description: "Rota inexistente ou excecao do processador."
      properties:
        status: { type: string, example: error }
        mensagem: { type: string }
        tipo: { type: string }
    BrValidationError:
      type: object
      description: "Falha de validacao do corpo: corpo nulo, nao-objeto, ou sem route."
      properties:
        erro: { type: string }
